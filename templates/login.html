<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Kirish | Uzum Sklad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            background: white;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-4">Tizimga kirish</h3>
    
    <form method="post">
        {% csrf_token %}
        
        {% if form.errors %}
            <div class="alert alert-danger">
                Login yoki parol xato!
            </div>
        {% endif %}

        <div class="mb-3">
            <label for="id_username" class="form-label">Login</label>
            <input type="text" name="username" class="form-control" id="id_username" required autofocus>
        </div>

        <div class="mb-3">
            <label for="id_password" class="form-label">Parol</label>
            <input type="password" name="password" class="form-control" id="id_password" required>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Kirish</button>
        </div>
    </form>
    
    <div class="text-center mt-3">
        <small class="text-muted"><a href="{% url 'register' %}">Akkaunt mavjud emasmi?</a></small>
    </div>
</div>

</body>
</html>
