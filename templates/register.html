<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Ro'yxatdan o'tish | Uzum Sklad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; }
        .card { width: 100%; max-width: 400px; padding: 20px; }
    </style>
</head>
<body>
<div class="card shadow">
    <h3 class="text-center mb-4">Ro'yxatdan o'tish</h3>
    <form method="post">
        {% csrf_token %}
        
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="text-danger small">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit" class="btn btn-success w-100">Tasdiqlash</button>
    </form>
    <div class="text-center mt-3">
        <a href="{% url 'login' %}">Akkaunt bormi? Kirish</a>
    </div>
</div>
</body>
</html>
